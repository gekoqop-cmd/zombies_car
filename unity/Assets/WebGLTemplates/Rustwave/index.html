<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, height=device-height, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>{{{ PRODUCT_NAME }}}</title>
    <style>
      /* Full-window game: no scrolling, pull-to-refresh, text selection, long-press menus or double-tap zoom
         (Yandex Games requirements for mobile). */
      html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #120c08;
        overscroll-behavior: none; touch-action: none; -webkit-user-select: none; user-select: none;
        -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent; }
      #unity-canvas { position: fixed; left: 0; top: 0; width: 100%; height: 100%; display: block; background: #120c08;
        outline: none; touch-action: none; }
      #loading { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
        background: #120c08 url('TemplateData/background.jpg') center / cover no-repeat; transition: opacity .3s; }
      #loading::before { content: ""; position: absolute; inset: 0; background: rgba(10, 6, 4, .55); }
      #logo { position: relative; width: min(70vw, 560px); height: auto; }
      #bar { position: relative; margin-top: 4vh; width: min(60vw, 420px); height: 14px; border-radius: 7px;
        background: rgba(0, 0, 0, .6); box-shadow: 0 0 0 2px rgba(255, 220, 170, .35); overflow: hidden; }
      #fill { width: 0; height: 100%; border-radius: 7px; background: linear-gradient(90deg, #e2601c, #f7a33a); }
      #error { position: fixed; left: 0; right: 0; bottom: 0; padding: 12px; font: 14px sans-serif; color: #fff;
        background: #a0231a; display: none; }
    </style>
  </head>
  <body oncontextmenu="return false;">
    <canvas id="unity-canvas" tabindex="-1"></canvas>
    <div id="loading">
      <img id="logo" src="TemplateData/logo.png" alt="">
      <div id="bar"><div id="fill"></div></div>
    </div>
    <div id="error"></div>
    <script>
      var canvas = document.getElementById("unity-canvas");
      var isMobile = /iPhone|iPad|iPod|Android/i.test(navigator.userAgent) ||
        (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);

      function showError(message) {
        var e = document.getElementById("error");
        e.textContent = message;
        e.style.display = "block";
      }

      var buildUrl = "Build";
      var config = {
        arguments: [],
#if PROGRESSIVE_ASSET_LOADING
        primaryDataUrls: {{{ JSON.stringify(PRIMARY_DATA_FILES) }}},
        secondaryDataUrls: {{{ JSON.stringify(SECONDARY_DATA_FILES) }}},
#else
        dataUrl: buildUrl + "/{{{ DATA_FILENAME }}}",
#endif
        frameworkUrl: buildUrl + "/{{{ FRAMEWORK_FILENAME }}}",
#if USE_WASM
        codeUrl: buildUrl + "/{{{ CODE_FILENAME }}}",
#endif
#if SYMBOLS_FILENAME
        symbolsUrl: buildUrl + "/{{{ SYMBOLS_FILENAME }}}",
#endif
        streamingAssetsUrl: "StreamingAssets",
        companyName: {{{ JSON.stringify(COMPANY_NAME) }}},
        productName: {{{ JSON.stringify(PRODUCT_NAME) }}},
        productVersion: {{{ JSON.stringify(PRODUCT_VERSION) }}},
        showBanner: function (msg, type) { if (type === "error") showError(msg); },
      };
      // Phones have 2-3x screens: rendering at full density costs 4-9x the pixels. Cap it (the game's own quality
      // tiers then scale further with their render scale).
      if (isMobile)
        config.devicePixelRatio = Math.min(window.devicePixelRatio || 1, 1.5);

      var script = document.createElement("script");
      script.src = buildUrl + "/{{{ LOADER_FILENAME }}}";
      script.onload = function () {
        createUnityInstance(canvas, config, function (progress) {
          document.getElementById("fill").style.width = (100 * progress) + "%";
        }).then(function (instance) {
          window.unityInstance = instance;
          var loading = document.getElementById("loading");
          loading.style.opacity = "0";
          setTimeout(function () { loading.style.display = "none"; }, 300);
          canvas.focus();
        }).catch(function (message) { showError(message); });
      };
      document.body.appendChild(script);

      // Keep keyboard focus on the game and block page scrolling by the game keys.
      window.addEventListener("keydown", function (e) {
        if (["ArrowUp", "ArrowDown", "ArrowLeft", "ArrowRight", " ", "Space"].indexOf(e.key) >= 0) e.preventDefault();
      });
      document.addEventListener("touchmove", function (e) { e.preventDefault(); }, { passive: false });
      document.addEventListener("gesturestart", function (e) { e.preventDefault(); });
    </script>
  </body>
</html>
